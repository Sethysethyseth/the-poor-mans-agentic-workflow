<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="One task travelling five stops: Plan on the smart agent, Hand off by you, Build on the cheap agent, Check on the smart agent, Land by you. Review can send work back from Check to Build.">
<style><![CDATA[
  .paper  { fill: #12181F; }
  .edge   { fill: none; stroke: #253040; stroke-width: 1; }
  .ink    { fill: #E6ECF3; }
  .soft   { fill: #9FADBD; }
  .faint  { fill: #6C7A8A; }
  .rail   { stroke: #2F3B4A; }
  .sans   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; }
  .mono   { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  .smart  { fill: #E0A94A; } .smartS { stroke: #E0A94A; } .smartW { fill: #2E2416; }
  .cheap  { fill: #43B8AE; } .cheapS { stroke: #43B8AE; } .cheapW { fill: #122E2C; }
  .you    { fill: #A9BAD0; } .youS   { stroke: #A9BAD0; } .youW   { fill: #1E2632; }

  .tok    { animation: ride 13s cubic-bezier(.5,0,.2,1) infinite, wink 13s linear infinite; }
  .ring   { animation: pop 13s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .r1 { animation-delay: 0s }    .r2 { animation-delay: 2.6s }
  .r3 { animation-delay: 5.2s }  .r4 { animation-delay: 7.8s }
  .r5 { animation-delay: 10.4s }
  .arcline { animation: arcpulse 13s ease-out infinite; animation-delay: 7.8s; }
  .arctext { animation: arcpulse 13s ease-out infinite; animation-delay: 7.8s; }

  @keyframes ride {
    0%,   16% { transform: translateX(0px); }
    20%,  36% { transform: translateX(197px); }
    40%,  56% { transform: translateX(394px); }
    60%,  76% { transform: translateX(591px); }
    80%, 100% { transform: translateX(788px); }
  }
  @keyframes wink {
    0% { opacity: 0 } 3%, 94% { opacity: 1 } 99%, 100% { opacity: 0 }
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.75) }
    3% { opacity: .85; transform: scale(1) }
    15% { opacity: 0; transform: scale(1.5) }
    100% { opacity: 0; transform: scale(1.5) }
  }
  @keyframes arcpulse {
    0%, 2% { opacity: .25 } 5%, 14% { opacity: 1 } 20%, 100% { opacity: .25 }
  }
  @media (prefers-reduced-motion: reduce) {
    .tok, .ring, .arcline, .arctext { animation: none; }
    .tok { transform: translateX(394px); }
    .ring { opacity: 0; }
    .arcline, .arctext { opacity: .5; }
  }
]]></style>

<rect class="paper" x="0" y="0" width="1000" height="360" rx="14"/>
<rect class="edge" x="0.5" y="0.5" width="999" height="359" rx="14"/>

<text class="mono faint" x="46" y="46" font-size="12" letter-spacing="2.4">ONE TASK · FIVE STOPS · TWO AGENTS</text>
<text class="sans ink" x="46" y="80" font-size="21" font-weight="700">The colour tells you who is paying for that step.</text>

<!-- rail -->
<line class="rail" x1="106" y1="170" x2="894" y2="170" stroke-width="5" stroke-linecap="round"/>

<!-- send-back arc: Check (stop 4) back to Build (stop 3) -->
<path class="arcline smartS" d="M 697 196 C 697 250, 500 250, 500 196" fill="none" stroke-width="2" stroke-dasharray="6 6"/>
<text class="mono smart arctext" x="598" y="266" font-size="11" letter-spacing="1.4" text-anchor="middle">NOT GOOD ENOUGH → BACK TO 03</text>

<!-- stops -->
<g>
  <circle class="ring smartS r1" cx="106" cy="170" r="26" fill="none" stroke-width="2"/>
  <circle class="smartW" cx="106" cy="170" r="21"/>
  <circle class="smartS" cx="106" cy="170" r="21" fill="none" stroke-width="3"/>
  <text class="mono smart" x="106" y="175" font-size="12" font-weight="700" text-anchor="middle">01</text>
  <text class="sans ink" x="106" y="216" font-size="15" font-weight="700" text-anchor="middle">Plan</text>
  <text class="sans soft" x="106" y="234" font-size="12" text-anchor="middle">smart agent</text>
</g>
<g>
  <circle class="ring youS r2" cx="303" cy="170" r="26" fill="none" stroke-width="2"/>
  <circle class="youW" cx="303" cy="170" r="21"/>
  <circle class="youS" cx="303" cy="170" r="21" fill="none" stroke-width="3"/>
  <text class="mono you" x="303" y="175" font-size="12" font-weight="700" text-anchor="middle">02</text>
  <text class="sans ink" x="303" y="216" font-size="15" font-weight="700" text-anchor="middle">Hand off</text>
  <text class="sans soft" x="303" y="234" font-size="12" text-anchor="middle">you paste one line</text>
</g>
<g>
  <circle class="ring cheapS r3" cx="500" cy="170" r="26" fill="none" stroke-width="2"/>
  <circle class="cheapW" cx="500" cy="170" r="21"/>
  <circle class="cheapS" cx="500" cy="170" r="21" fill="none" stroke-width="3"/>
  <text class="mono cheap" x="500" y="175" font-size="12" font-weight="700" text-anchor="middle">03</text>
  <text class="sans ink" x="500" y="216" font-size="15" font-weight="700" text-anchor="middle">Build</text>
  <text class="sans soft" x="500" y="234" font-size="12" text-anchor="middle">cheap agent, then stops</text>
</g>
<g>
  <circle class="ring smartS r4" cx="697" cy="170" r="26" fill="none" stroke-width="2"/>
  <circle class="smartW" cx="697" cy="170" r="21"/>
  <circle class="smartS" cx="697" cy="170" r="21" fill="none" stroke-width="3"/>
  <text class="mono smart" x="697" y="175" font-size="12" font-weight="700" text-anchor="middle">04</text>
  <text class="sans ink" x="697" y="216" font-size="15" font-weight="700" text-anchor="middle">Check</text>
  <text class="sans soft" x="697" y="234" font-size="12" text-anchor="middle">re-runs the tests itself</text>
</g>
<g>
  <circle class="ring youS r5" cx="894" cy="170" r="26" fill="none" stroke-width="2"/>
  <circle class="youW" cx="894" cy="170" r="21"/>
  <circle class="youS" cx="894" cy="170" r="21" fill="none" stroke-width="3"/>
  <text class="mono you" x="894" y="175" font-size="12" font-weight="700" text-anchor="middle">05</text>
  <text class="sans ink" x="894" y="216" font-size="15" font-weight="700" text-anchor="middle">Land</text>
  <text class="sans soft" x="894" y="234" font-size="12" text-anchor="middle">you say the word</text>
</g>

<!-- the travelling task -->
<g class="tok">
  <rect class="paper" x="96" y="160" width="20" height="20" rx="5"/>
  <rect class="ink" x="96" y="160" width="20" height="20" rx="5" opacity="0"/>
  <rect x="96.5" y="160.5" width="19" height="19" rx="5" fill="none" stroke="#E6ECF3" stroke-width="2.5"/>
  <line x1="101" y1="166" x2="111" y2="166" stroke="#E6ECF3" stroke-width="1.6"/>
  <line x1="101" y1="170" x2="111" y2="170" stroke="#E6ECF3" stroke-width="1.6"/>
  <line x1="101" y1="174" x2="107" y2="174" stroke="#E6ECF3" stroke-width="1.6"/>
</g>

<!-- legend -->
<line class="edge" x1="46" y1="296" x2="954" y2="296" stroke="#253040"/>
<circle class="smart" cx="52" cy="324" r="6"/>
<text class="sans soft" x="66" y="329" font-size="13"><tspan class="ink" font-weight="600">Smart agent</tspan> — expensive, short bursts</text>
<circle class="cheap" cx="330" cy="324" r="6"/>
<text class="sans soft" x="344" y="329" font-size="13"><tspan class="ink" font-weight="600">Cheap agent</tspan> — commodity typing</text>
<circle class="you" cx="600" cy="324" r="6"/>
<text class="sans soft" x="614" y="329" font-size="13"><tspan class="ink" font-weight="600">You</tspan> — two handoffs, that's the job</text>
</svg>
