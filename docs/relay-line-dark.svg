<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="One task traveling five stops: Plan on the smart agent, Hand off by you, Build on the cheap agent, Check on the smart agent, Land by you. Review can send work back from Check to Build.">
<style><![CDATA[
  .paper  { fill: #12181F; }
  .edge   { fill: none; stroke: #253040; stroke-width: 1; }
  .ink    { fill: #E6ECF3; }
  .soft   { fill: #9FADBD; }
  .faint  { fill: #6C7A8A; }
  .rail   { stroke: #2F3B4A; }
  .sans   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; }
  .mono   { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  .smart  { fill: #E0A94A; } .smartS { stroke: #E0A94A; } .smartW { fill: #2E2416; }
  .cheap  { fill: #43B8AE; } .cheapS { stroke: #43B8AE; } .cheapW { fill: #122E2C; }
  .you    { fill: #A9BAD0; } .youS   { stroke: #A9BAD0; } .youW   { fill: #1E2632; }

  .tok    { animation: ride 13s cubic-bezier(.5,0,.2,1) infinite; }
  .ring   { animation: pop 13s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .r1 { animation-delay: 0s }    .r2 { animation-delay: 2.6s }
  .r3 { animation-delay: 5.2s }  .r4 { animation-delay: 7.8s }
  .r5 { animation-delay: 10.4s }
  .arcg   { animation: arcpulse 13s ease-out infinite; animation-delay: 7.8s; opacity: .3; }

  @keyframes ride {
    0%,   16% { transform: translateX(0px); }
    20%,  36% { transform: translateX(197px); }
    40%,  56% { transform: translateX(394px); }
    60%,  76% { transform: translateX(591px); }
    80%, 96% { transform: translateX(788px); }
    100%      { transform: translateX(788px); }
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.75) }
    3% { opacity: .9; transform: scale(1) }
    15% { opacity: 0; transform: scale(1.55) }
    100% { opacity: 0; transform: scale(1.55) }
  }
  @keyframes arcpulse {
    0%, 2% { opacity: .3 } 5%, 14% { opacity: 1 } 22%, 100% { opacity: .3 }
  }
  @media (prefers-reduced-motion: reduce) {
    .tok, .ring, .arcg { animation: none; }
    .tok { transform: translateX(394px); }
    .ring { opacity: 0; }
    .arcg { opacity: .6; }
  }
]]></style>

<rect class="paper" x="0" y="0" width="1000" height="400" rx="14"/>
<rect class="edge" x="0.5" y="0.5" width="999" height="399" rx="14"/>

<text class="mono faint" x="46" y="44" font-size="12" letter-spacing="2.4">ONE TASK · FIVE STOPS · TWO AGENTS</text>
<text class="sans ink" x="46" y="78" font-size="21" font-weight="700">The color tells you who is paying for that step.</text>

<!-- the traveling task, riding above the rail -->
<g class="tok">
  <rect x="94.5" y="122.5" width="23" height="23" rx="6" class="paper"/>
  <rect x="94.5" y="122.5" width="23" height="23" rx="6" fill="none" stroke="#E6ECF3" stroke-width="2.5"/>
  <line x1="100" y1="129" x2="112" y2="129" stroke="#E6ECF3" stroke-width="1.7"/>
  <line x1="100" y1="134" x2="112" y2="134" stroke="#E6ECF3" stroke-width="1.7"/>
  <line x1="100" y1="139" x2="107" y2="139" stroke="#E6ECF3" stroke-width="1.7"/>
</g>

<!-- rail -->
<line class="rail" x1="106" y1="180" x2="894" y2="180" stroke-width="5" stroke-linecap="round"/>

<!-- stops -->
<g>
  <circle class="ring smartS r1" cx="106" cy="180" r="26" fill="none" stroke-width="2"/>
  <circle class="smartW" cx="106" cy="180" r="21"/>
  <circle class="smartS" cx="106" cy="180" r="21" fill="none" stroke-width="3"/>
  <text class="mono smart" x="106" y="185" font-size="12" font-weight="700" text-anchor="middle">01</text>
  <text class="sans ink" x="106" y="228" font-size="15" font-weight="700" text-anchor="middle">Plan</text>
  <text class="sans soft" x="106" y="246" font-size="12" text-anchor="middle">smart agent</text>
</g>
<g>
  <circle class="ring youS r2" cx="303" cy="180" r="26" fill="none" stroke-width="2"/>
  <circle class="youW" cx="303" cy="180" r="21"/>
  <circle class="youS" cx="303" cy="180" r="21" fill="none" stroke-width="3"/>
  <text class="mono you" x="303" y="185" font-size="12" font-weight="700" text-anchor="middle">02</text>
  <text class="sans ink" x="303" y="228" font-size="15" font-weight="700" text-anchor="middle">Hand off</text>
  <text class="sans soft" x="303" y="246" font-size="12" text-anchor="middle">you paste one line</text>
</g>
<g>
  <circle class="ring cheapS r3" cx="500" cy="180" r="26" fill="none" stroke-width="2"/>
  <circle class="cheapW" cx="500" cy="180" r="21"/>
  <circle class="cheapS" cx="500" cy="180" r="21" fill="none" stroke-width="3"/>
  <text class="mono cheap" x="500" y="185" font-size="12" font-weight="700" text-anchor="middle">03</text>
  <text class="sans ink" x="500" y="228" font-size="15" font-weight="700" text-anchor="middle">Build</text>
  <text class="sans soft" x="500" y="246" font-size="12" text-anchor="middle">cheap agent, then stops</text>
</g>
<g>
  <circle class="ring smartS r4" cx="697" cy="180" r="26" fill="none" stroke-width="2"/>
  <circle class="smartW" cx="697" cy="180" r="21"/>
  <circle class="smartS" cx="697" cy="180" r="21" fill="none" stroke-width="3"/>
  <text class="mono smart" x="697" y="185" font-size="12" font-weight="700" text-anchor="middle">04</text>
  <text class="sans ink" x="697" y="228" font-size="15" font-weight="700" text-anchor="middle">Check</text>
  <text class="sans soft" x="697" y="246" font-size="12" text-anchor="middle">re-runs the tests itself</text>
</g>
<g>
  <circle class="ring youS r5" cx="894" cy="180" r="26" fill="none" stroke-width="2"/>
  <circle class="youW" cx="894" cy="180" r="21"/>
  <circle class="youS" cx="894" cy="180" r="21" fill="none" stroke-width="3"/>
  <text class="mono you" x="894" y="185" font-size="12" font-weight="700" text-anchor="middle">05</text>
  <text class="sans ink" x="894" y="228" font-size="15" font-weight="700" text-anchor="middle">Land</text>
  <text class="sans soft" x="894" y="246" font-size="12" text-anchor="middle">you say the word</text>
</g>

<!-- send-back arc, clear of the labels -->
<g class="arcg">
  <path class="smartS" d="M 697 268 C 697 306, 512 306, 503 288" fill="none" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path class="smart" d="M 503 282 l 7 12 l -13 1 z"/>
  <text class="mono smart" x="600" y="326" font-size="11" letter-spacing="1.4" text-anchor="middle">NOT GOOD ENOUGH → BACK TO 03</text>
</g>

<!-- legend -->
<line class="edge" x1="46" y1="348" x2="954" y2="348"/>
<circle class="smart" cx="52" cy="374" r="6"/>
<text class="sans soft" x="66" y="379" font-size="13"><tspan class="ink" font-weight="600">Smart agent</tspan> — expensive, short bursts</text>
<circle class="cheap" cx="330" cy="374" r="6"/>
<text class="sans soft" x="344" y="379" font-size="13"><tspan class="ink" font-weight="600">Cheap agent</tspan> — commodity typing</text>
<circle class="you" cx="600" cy="374" r="6"/>
<text class="sans soft" x="614" y="379" font-size="13"><tspan class="ink" font-weight="600">You</tspan> — two handoffs, that's the whole job</text>
</svg>
