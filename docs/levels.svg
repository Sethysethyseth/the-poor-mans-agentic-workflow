<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Four levels. Level 0: one agent does plan and build, no check step, zero to twenty dollars a month. Level 1: one seat plays all three roles in separate sessions, about twenty dollars a month, you hand off by hand. Level 2: a cheap second agent takes over building, about forty dollars a month, you still hand off. Level 3: same two seats, handoffs happen automatically. Levels 2 and 3 are separate upgrades - capacity and autonomy - and you can step back down at any time.">
<style><![CDATA[
  .paper  { fill: #F5F7F9; }
  .card   { fill: #FFFFFF; }
  .edge   { fill: none; stroke: #DCE3EA; stroke-width: 1; }
  .ink    { fill: #16202B; }
  .soft   { fill: #5A6875; }
  .faint  { fill: #8A96A4; }
  .sans   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; }
  .mono   { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  .smartF { fill: #B5761A; } .smartB { fill: #F7EBD6; } .smartS { stroke: #B5761A; }
  .cheapF { fill: #14756F; } .cheapB { fill: #DDEEEC; } .cheapS { stroke: #14756F; }
  .noneB  { fill: #EDF0F3; } .noneS  { stroke: #C9D3DD; }
  .chipT  { fill: #E9EDF1; }

  .glow  { animation: lift 12s ease-in-out infinite; opacity: 0; }
  .g0 { animation-delay: 0s } .g1 { animation-delay: 3s }
  .g2 { animation-delay: 6s } .g3 { animation-delay: 9s }
  @keyframes lift {
    0%   { opacity: 0 }
    4%   { opacity: 1 }
    21%  { opacity: 1 }
    26%, 100% { opacity: 0 }
  }
  @media (prefers-reduced-motion: reduce) { .glow { animation: none; opacity: 0 } }
]]></style>

<rect class="paper" x="0" y="0" width="1000" height="430" rx="14"/>
<rect class="edge" x="0.5" y="0.5" width="999" height="429" rx="14"/>

<text class="mono faint" x="46" y="44" font-size="12" letter-spacing="2.4">WHERE TO START · AND WHAT EACH STEP ACTUALLY BUYS</text>
<text class="sans ink" x="46" y="78" font-size="21" font-weight="700">Every level is a fine place to stop.</text>

<!-- ============ LEVEL 0 ============ -->
<g>
  <rect class="card" x="46" y="106" width="209" height="212" rx="11"/>
  <rect class="edge" x="46.5" y="106.5" width="208" height="211" rx="11"/>
  <rect class="glow g0 smartS" x="44" y="104" width="213" height="216" rx="13" fill="none" stroke-width="2.5"/>
  <text class="mono faint" x="66" y="134" font-size="11" letter-spacing="1.8">LEVEL 0</text>
  <text class="sans ink" x="66" y="158" font-size="16" font-weight="700">Just one agent</text>
  <rect class="chipT" x="66" y="170" width="74" height="21" rx="10"/>
  <text class="mono soft" x="103" y="185" font-size="11" text-anchor="middle">$0–20/mo</text>
  <line x1="66" y1="206" x2="235" y2="206" stroke="#DCE3EA" stroke-width="1"/>
  <rect class="smartB" x="66" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="92" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">PLAN</text>
  <rect class="smartB" x="124" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="150" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">BUILD</text>
  <rect class="noneB noneS" x="182" y="218" width="53" height="26" rx="6" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="mono faint" x="208" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">NONE</text>
  <text class="sans soft" x="66" y="268" font-size="12.5">Nothing installed yet. You</text>
  <text class="sans soft" x="66" y="285" font-size="12.5">find out what an agent does.</text>
  <text class="mono faint" x="66" y="307" font-size="10.5" letter-spacing=".8">NO REVIEW STEP</text>
</g>

<!-- ============ LEVEL 1 ============ -->
<g>
  <rect class="card" x="279" y="106" width="209" height="212" rx="11"/>
  <rect class="edge" x="279.5" y="106.5" width="208" height="211" rx="11"/>
  <rect class="glow g1 smartS" x="277" y="104" width="213" height="216" rx="13" fill="none" stroke-width="2.5"/>
  <text class="mono faint" x="299" y="134" font-size="11" letter-spacing="1.8">LEVEL 1</text>
  <text class="sans ink" x="299" y="158" font-size="16" font-weight="700">The full loop</text>
  <rect class="chipT" x="299" y="170" width="74" height="21" rx="10"/>
  <text class="mono soft" x="336" y="185" font-size="11" text-anchor="middle">~$20/mo</text>
  <line x1="299" y1="206" x2="468" y2="206" stroke="#DCE3EA" stroke-width="1"/>
  <rect class="smartB" x="299" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="325" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">PLAN</text>
  <rect class="smartB" x="357" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="383" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">BUILD</text>
  <rect class="smartB" x="415" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="441" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">CHECK</text>
  <text class="sans soft" x="299" y="268" font-size="12.5">Adds the review gate. One</text>
  <text class="sans soft" x="299" y="285" font-size="12.5">seat, three separate sessions.</text>
  <text class="mono faint" x="299" y="307" font-size="10.5" letter-spacing=".8">HANDOFF: YOU</text>
</g>

<!-- ============ LEVEL 2 ============ -->
<g>
  <rect class="card" x="512" y="106" width="209" height="212" rx="11"/>
  <rect class="edge" x="512.5" y="106.5" width="208" height="211" rx="11"/>
  <rect class="glow g2 cheapS" x="510" y="104" width="213" height="216" rx="13" fill="none" stroke-width="2.5"/>
  <text class="mono faint" x="532" y="134" font-size="11" letter-spacing="1.8">LEVEL 2 · CAPACITY</text>
  <text class="sans ink" x="532" y="158" font-size="16" font-weight="700">A second seat</text>
  <rect class="chipT" x="532" y="170" width="74" height="21" rx="10"/>
  <text class="mono soft" x="569" y="185" font-size="11" text-anchor="middle">~$40/mo</text>
  <line x1="532" y1="206" x2="701" y2="206" stroke="#DCE3EA" stroke-width="1"/>
  <rect class="smartB" x="532" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="558" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">PLAN</text>
  <rect class="cheapB" x="590" y="218" width="53" height="26" rx="6"/>
  <text class="mono cheapF" x="616" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">BUILD</text>
  <rect class="smartB" x="648" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="674" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">CHECK</text>
  <text class="sans soft" x="532" y="268" font-size="12.5">A cheap agent takes over the</text>
  <text class="sans soft" x="532" y="285" font-size="12.5">typing. Your good seat lasts.</text>
  <text class="mono faint" x="532" y="307" font-size="10.5" letter-spacing=".8">HANDOFF: YOU</text>
</g>

<!-- ============ LEVEL 3 ============ -->
<g>
  <rect class="card" x="745" y="106" width="209" height="212" rx="11"/>
  <rect class="edge" x="745.5" y="106.5" width="208" height="211" rx="11"/>
  <rect class="glow g3 cheapS" x="743" y="104" width="213" height="216" rx="13" fill="none" stroke-width="2.5"/>
  <text class="mono faint" x="765" y="134" font-size="11" letter-spacing="1.8">LEVEL 3 · AUTONOMY</text>
  <text class="sans ink" x="765" y="158" font-size="16" font-weight="700">It runs itself</text>
  <rect class="chipT" x="765" y="170" width="74" height="21" rx="10"/>
  <text class="mono soft" x="802" y="185" font-size="11" text-anchor="middle">~$40/mo</text>
  <line x1="765" y1="206" x2="934" y2="206" stroke="#DCE3EA" stroke-width="1"/>
  <rect class="smartB" x="765" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="791" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">PLAN</text>
  <rect class="cheapB" x="823" y="218" width="53" height="26" rx="6"/>
  <text class="mono cheapF" x="849" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">BUILD</text>
  <rect class="smartB" x="881" y="218" width="53" height="26" rx="6"/>
  <text class="mono smartF" x="907" y="235" font-size="10" text-anchor="middle" letter-spacing=".6">CHECK</text>
  <text class="sans soft" x="765" y="268" font-size="12.5">Same two seats. You get your</text>
  <text class="sans soft" x="765" y="285" font-size="12.5">attention back, not capacity.</text>
  <text class="mono cheapF" x="765" y="307" font-size="10.5" letter-spacing=".8">HANDOFF: AUTOMATIC</text>
</g>

<!-- progression + step-back -->
<path class="smartS" d="M 255 212 L 273 212" stroke-width="2" fill="none"/>
<path class="smartF" d="M 279 212 l -8 -4.5 l 0 9 z"/>
<path class="smartS" d="M 488 212 L 506 212" stroke-width="2" fill="none"/>
<path class="smartF" d="M 512 212 l -8 -4.5 l 0 9 z"/>
<path class="smartS" d="M 721 212 L 739 212" stroke-width="2" fill="none"/>
<path class="smartF" d="M 745 212 l -8 -4.5 l 0 9 z"/>

<path class="noneS" d="M 894 340 C 894 372, 200 372, 150 348" fill="none" stroke-width="1.5" stroke-dasharray="5 5"/>
<path class="faint" d="M 146 342 l 9 3 l -5 7 z"/>
<text class="sans faint" x="560" y="388" font-size="12.5" text-anchor="middle">Stepping back down is a normal move — nothing gets uninstalled, and your work carries over.</text>
</svg>
